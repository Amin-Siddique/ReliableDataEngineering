[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Duplicate-topic posts retired in favour of the main article on that topic
[[redirects]]
  from = "/posts/article_gemma_4_local"
  to = "/posts/article_gemma_4_local_setup_guide"
  status = 301

[[redirects]]
  from = "/posts/article_agent_harness_real_product"
  to = "/posts/article_harness_is_everything"
  status = 301

[[redirects]]
  from = "/posts/article_anthropic_harness_design"
  to = "/posts/article_harness_is_everything"
  status = 301
